<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SubTutor 설정</title>
<link rel="stylesheet" href="options.css">
</head>
<body>
<header>
  <img src="../icons/icon48.png" width="34" height="34" alt="">
  <div><h1>SubTutor 설정</h1><div class="sub" id="version"></div></div>
</header>
<main>
  <section>
    <h2>대사 오디오 저장 폴더 <button class="info" data-key="folder" title="설명 · 근거">i</button></h2>
    <div class="status-box">
      <div><span class="k">현재 저장 위치</span> <b id="dirName">크롬 다운로드 폴더</b> <span class="path">› SubTutor › 작품 › 대사.mp3</span></div>
      <div><span class="k">폴더 권한</span> <b id="permState">—</b></div>
    </div>
    <div class="buttons">
      <button id="pick" class="primary">📁 폴더 선택…</button>
      <button id="grant" class="hidden">🔓 폴더 권한 허용</button>
      <button id="persist" class="hidden">🔒 다시 묻지 않게 고정</button>
      <button id="reset" class="hidden">기본값(다운로드 폴더)으로</button>
    </div>
    <div id="msg" class="msg"></div>
    <details id="help" class="hidden">
      <summary>크롬의 폴더 권한</summary>
    </details>
  </section>
  <section>
    <h2>별표 저장 시 오디오 <button class="info" data-key="audioStore" title="설명 · 근거">i</button></h2>
    <label class="inline">처리 방식
      <select id="audioMode">
        <option value="off">저장 안 함</option>
        <option value="store">웹 재생용으로 보관 (확장 프로그램 안)</option>
        <option value="download">PC에 MP3 파일로 저장 (웹은 그 파일로 재생)</option>
      </select>
    </label>
  </section>
</main>
<div id="infobox" class="infobox hidden"><div class="infobox-head"><b id="infoTitle"></b><button id="infoClose">닫기</button></div><div id="infoBody" class="infobox-body"></div></div>
<script src="../src/lib/fs.js"></script>
<script src="../src/lib/explain.js"></script>
<script src="options.js"></script>
</body>
</html>
